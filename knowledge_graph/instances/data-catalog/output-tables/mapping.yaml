  module: module5
  category: simulation_output
  ontology_class: cs:DeploymentPlan
  source_config: M5_DeploymentPlan
  source_df: deployment_plan
  key_columns: [date, material, sending, receiving, demand_qty, demand_element, planned_qty, deployed_qty_invcon, deploy_qty_with_plan_order, deploy_from_in_transit, deploy_from_open_deployment_inbound, deploy_from_future_production, planned_delivery_date, orig_location, leadtime, is_cross_node, deployed_qty, quota, deployed_qty_invcon_push]
  description: 部署/调拨计划 — M5 决定各物料在网络节点间的调拨量与来源拆分。

- db_table: module5_output_stockonhandlog
  module: module5
  category: log
  ontology_class: null
  source_config: null
  source_df: stock_on_hand_log
  key_columns: [material, location, date, beginning_soh, production, in_transit, delivery_gr, today_shipment, deployed_qty, ending_soh]
  description: 在手库存日志 — M5 视角的每日库存平衡明细。

- db_table: module5_output_unfulfilledlog
  module: module5
  category: log
  ontology_class: null
  source_config: null
  source_df: unfulfilled_log
  key_columns: [date, sending, receiving, demand_qty, demand_element, unfulfilled_qty, reason]
  description: 未满足需求日志 — 部署阶段无法满足的需求及原因。

- db_table: module5_output_validation
  module: module5
  category: validation
  ontology_class: null
  source_config: null
  source_df: validation_log
  key_columns: [no, issue]
  description: M5 配置/数据校验问题清单。

# ───────────────────────── Module 6 — Logistics Execution (6) ─────────────────────────
- db_table: module6_output_deliveryplan
  module: module6
  category: simulation_output
  ontology_class: cs:IntersiteDelivery
  source_config: M6_DeliveryPlan
  source_df: delivery_plan
  key_columns: [vehicle_uid, ori_deployment_uid, material, sending, receiving, planned_deployment_date, actual_ship_date, actual_delivery_date, delivery_qty, truck_type, truck_load_pct, wfr, vfr]
  description: 交付/运输计划 — M6 按卡车装载执行的跨节点配送（含装载率 WFR/VFR）。

- db_table: module6_output_vehiclelog
  module: module6
  category: log
