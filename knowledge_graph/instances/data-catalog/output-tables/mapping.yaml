  source_config: Orchestrator_production_gr
  source_df: production_gr_*.csv
  key_columns: [date, material, location, quantity, file_date]
  description: 生产收货(GR) — 生产完成可用(available_date 到达)，增加生产地库存。

- db_table: orchestrator_space_quota
  module: orchestrator
