  description: 车辆装载日志 — 每辆车的装载量、重量、体积与触发原因。

- db_table: module6_output_truckusagelog
  module: module6
  category: log
  ontology_class: null
  source_config: null
  source_df: truck_usage
  key_columns: [date, sending, receiving, truck_type, truck_used]
  description: 卡车使用日志 — 各线路按卡车类型的用车数量。

- db_table: module6_output_unsatisfiedmdqlog
  module: module6
  category: log
  ontology_class: null
  source_config: null
  source_df: unsatisfied_log
  key_columns: []
  description: 未满足 MDQ 日志 — 未达最小发运量(MDQ)的部署记录（仅含公共列时为空表）。

- db_table: module6_output_validationlog
  module: module6
  category: validation
  ontology_class: null
  source_config: null
  source_df: validation_log
  key_columns: []
  description: M6 校验日志。

- db_table: module6_output_bypassrulehitlog
  module: module6
  category: log
  ontology_class: null
  source_config: null
  source_df: bypass_log
  key_columns: [ori_deployment_uid, rule_id, simulation_date, context_snapshot, vehicle_uid]
  description: MDQ 绕过规则命中日志 — 记录哪些部署命中了 M6_MDQBypassRules 规则。

