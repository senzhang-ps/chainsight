<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChainSight Knowledge Graph</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
<script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:'Segoe UI','Inter',system-ui,sans-serif;background:#0b0e17;color:#cbd5e1;overflow:hidden}
  #bar{height:50px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0f1320;border-bottom:1px solid #1e293b;position:relative;z-index:5}
  #bar h1{font-size:15px;font-weight:700;letter-spacing:.4px;color:#e2e8f0;white-space:nowrap}
  #bar h1 span{background:linear-gradient(135deg,#38bdf8,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #search{background:#111827;border:1px solid #1e293b;border-radius:7px;color:#e2e8f0;font-size:13px;padding:7px 12px;width:220px;outline:none}
  #search:focus{border-color:#38bdf8}
  .lbtn{padding:6px 12px;border:1px solid #1e293b;border-radius:7px;background:#111827;color:#94a3b8;font-size:12.5px;font-weight:600;cursor:pointer}
  .lbtn:hover{color:#e2e8f0;border-color:#334155}
  .lbtn.active{color:#0b0e17;background:linear-gradient(135deg,#38bdf8,#a78bfa);border-color:transparent}
  #stats{margin-left:auto;font-size:12px;color:#64748b;white-space:nowrap}
  #cy{position:absolute;top:50px;left:230px;right:300px;bottom:0}
  #left{position:absolute;top:50px;left:0;bottom:0;width:230px;background:#0f1320;border-right:1px solid #1e293b;padding:14px;overflow:auto}
  #left h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin:14px 0 8px}
  #left h3:first-child{margin-top:0}
  .layer{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0;cursor:pointer;user-select:none}
  .layer input{accent-color:#38bdf8;width:14px;height:14px;cursor:pointer}
  .layer .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
  .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:5px 0;color:#94a3b8}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .ln{width:18px;height:0;border-top:2px solid;flex:0 0 auto}
  #side{position:absolute;top:50px;right:0;bottom:0;width:300px;background:#0f1320;border-left:1px solid #1e293b;padding:16px;overflow:auto}
  #side h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:10px}
  #side .empty{color:#475569;font-size:13px;font-style:italic}
  .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700;color:#0b0e17;margin-bottom:12px}
  .kv{margin:9px 0;font-size:12.5px;line-height:1.5}
  .kv .k{color:#64748b;display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
  .kv .v{color:#e2e8f0;word-break:break-word}
</style>
</head>
<body>
<div id="bar">
  <h1><span>ChainSight</span> KG</h1>
  <input id="search" placeholder="搜索节点…"/>
  <button class="lbtn" id="lay-fcose">聚类布局</button>
  <button class="lbtn" id="lay-dagre">因果流向 (LR)</button>
  <button class="lbtn" id="fit">适应屏幕</button>
  <div id="stats"></div>
</div>
<div id="left">
  <h3>图层 Layers</h3>
  <div id="layers"></div>
  <h3>节点 Nodes</h3>
  <div id="lg-nodes"></div>
  <h3>连线 Edges</h3>
  <div id="lg-edges"></div>
</div>
<div id="cy"></div>
<div id="side"><h3>详情 Details</h3><div class="empty">点击任意节点查看详情</div></div>
<script>
const DATA = {"elements": [{"data": {"id": "cs:Network", "label": "Network", "ntype": "class", "layers": ["ontology"], "color": "#38bdf8", "border": "#38bdf8", "detail": {"kind": "Top Class", "id": "cs:Network", "category": "cs:Network", "comment": "Supply chain network topology entities — locations and arcs that form the physical structure."}}}, {"data": {"id": "cs:Product", "label": "Product", "ntype": "class", "layers": ["ontology"], "color": "#2dd4bf", "border": "#2dd4bf", "detail": {"kind": "Top Class", "id": "cs:Product", "category": "cs:Product", "comment": "Product entities — materials flowing through the network and their production mappings."}}}, {"data": {"id": "cs:Resource", "label": "Resource", "ntype": "class", "layers": ["ontology"], "color": "#fb923c", "border": "#fb923c", "detail": {"kind": "Top Class", "id": "cs:Resource", "category": "cs:Resource", "comment": "Execution capacity entities — production lines, storage space, vehicles."}}}, {"data": {"id": "cs:Inventory", "label": "Inventory", "ntype": "class", "layers": ["ontology"], "color": "#a78bfa", "border": "#a78bfa", "detail": {"kind": "Top Class", "id": "cs:Inventory", "category": "cs:Inventory", "comment": "Inventory state entities — current stock positions across the network."}}}, {"data": {"id": "cs:Plan", "label": "Plan", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Top Class", "id": "cs:Plan", "category": "cs:Plan", "comment": "Business transaction entities — orders, shipments, production plans, deployment plans."}}}, {"data": {"id": "cs:Parameter", "label": "Parameter", "ntype": "class", "layers": ["ontology"], "color": "#f472b6", "border": "#f472b6", "detail": {"kind": "Top Class", "id": "cs:Parameter", "category": "cs:Parameter", "comment": "Tunable business parameters — the primary targets for what-if scenario analysis."}}}, {"data": {"id": "cs:Metric", "label": "Metric", "ntype": "class", "layers": ["ontology"], "color": "#fbbf24", "border": "#fbbf24", "detail": {"kind": "Top Class", "id": "cs:Metric", "category": "cs:Metric", "comment": "KPI and performance metric entities — outputs measured by the simulation."}}}, {"data": {"id": "cs:Location", "label": "Location", "ntype": "class", "layers": ["ontology"], "color": "#38bdf8", "border": "#38bdf8", "detail": {"kind": "Class", "id": "cs:Location", "category": "cs:Network", "subClassOf": "cs:Network", "source_type": "config_input", "source_config": "Global_Network", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_supply_network_design_master"], "comment": "A physical node in the supply chain network. Each location is either a Plant (manufacturing site) or DC (distribution center). Location IDs are 4-digit zero-padded strings."}}}, {"data": {"id": "cs:TransportationLane", "label": "TransportationLane", "ntype": "class", "layers": ["ontology"], "color": "#38bdf8", "border": "#38bdf8", "detail": {"kind": "Class", "id": "cs:TransportationLane", "category": "cs:Network", "subClassOf": "cs:Network", "source_type": "config_input", "source_config": "Global_LeadTime", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_transportation_lanes_current_future", "cdl_ps_hana_prd.sl.ps_psc_transportation_lanes_history"], "comment": "A directed transportation lane between two locations defining lead time parameters for material flow. Each lane connects a sending location to a receiving location with time-based logistics constraints."}}}, {"data": {"id": "cs:MaterialLocation", "label": "MaterialLocation", "ntype": "class", "layers": ["ontology"], "color": "#38bdf8", "border": "#38bdf8", "detail": {"kind": "Class", "id": "cs:MaterialLocation", "category": "cs:Network", "subClassOf": "cs:Network", "source_type": "derived", "source_config": "derived", "source_table": ["cdl_ps_hana_prd.dwd.tb_mdm_prod_material_plant_dim"], "comment": "The combination of a material and a location — a fundamental dimension in ChainSight. Many parameters (demand forecast, safety stock, inventory, etc.) are configured at this granularity. Represents that a specific material exists at or is managed by a specific location."}}}, {"data": {"id": "cs:Material", "label": "Material", "ntype": "class", "layers": ["ontology"], "color": "#2dd4bf", "border": "#2dd4bf", "detail": {"kind": "Class", "id": "cs:Material", "category": "cs:Product", "subClassOf": "cs:Product", "source_type": "config_input", "source_config": "M6_MaterialMD", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_sku_master", "cdl_ps_hana_prd.dwd.tb_mdm_prod_material_general_dim"], "comment": "A product/SKU that flows through the supply chain network. Material IDs are numeric strings (no .0 suffix). Physical conversion factors are used for truck loading (WFR/VFR) and warehouse capacity calculations."}}}, {"data": {"id": "cs:MaterialLocationLine", "label": "MaterialLocationLine", "ntype": "class", "layers": ["ontology"], "color": "#2dd4bf", "border": "#2dd4bf", "detail": {"kind": "Class", "id": "cs:MaterialLocationLine", "category": "cs:Product", "subClassOf": "cs:Product", "source_type": "config_input", "source_config": "M4_MaterialLocationLineCfg", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_sip_production_version"], "comment": "Production capability configuration — maps which material is assigned to which production line at which plant location, along with production planning parameters. Each record defines the production setup for one material on one specific line."}}}, {"data": {"id": "cs:ProductionLine", "label": "ProductionLine", "ntype": "class", "layers": ["ontology"], "color": "#fb923c", "border": "#fb923c", "detail": {"kind": "Class", "id": "cs:ProductionLine", "category": "cs:Resource", "subClassOf": "cs:Resource", "source_type": "config_input", "source_config": "M4_LineCapacity", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_sip_production_version", "cdl_ps_hana_prd.sl.ps_psc_sip_recipe"], "comment": "A production line at a plant location with date-specific capacity. Capacity defines the available production hours on a given date. Multiply by MaterialLocationLine.prd_rate to get producible units. MaterialLocationLine.delegate_line references this line."}}}, {"data": {"id": "cs:SpaceCapacity", "label": "SpaceCapacity", "ntype": "class", "layers": ["ontology"], "color": "#fb923c", "border": "#fb923c", "detail": {"kind": "Class", "id": "cs:SpaceCapacity", "category": "cs:Resource", "subClassOf": "cs:Resource", "source_type": "config_input", "source_config": "Global_SpaceCapacity", "comment": "Maximum storage capacity at a location for a given time period. Time-versioned: one location can have multiple records covering different date ranges (e.g. seasonal capacity changes). Used by Orchestrator for overflow checks and M5 deployment planning for receiving space constraints."}}}, {"data": {"id": "cs:Vehicle", "label": "Vehicle", "ntype": "class", "layers": ["ontology"], "color": "#fb923c", "border": "#fb923c", "detail": {"kind": "Class", "id": "cs:Vehicle", "category": "cs:Resource", "subClassOf": "cs:Resource", "source_type": "config_input", "source_config": "M6_TruckTypeSpecs", "comment": "A truck type used for transportation between locations. Defines loading capacity constraints used by M6 for weight fill ratio (WFR) and volume fill ratio (VFR) truck loading calculations."}}}, {"data": {"id": "cs:TruckCapacity", "label": "TruckCapacity", "ntype": "class", "layers": ["ontology"], "color": "#fb923c", "border": "#fb923c", "detail": {"kind": "Class", "id": "cs:TruckCapacity", "category": "cs:Resource", "subClassOf": "cs:Resource", "source_type": "config_input", "source_config": "M6_TruckCapacityPlan", "comment": "Number of trucks of a given type available on a route per day. Defines transportation capacity constraints for M6 logistics execution. Supports both daily (date) and date-range (eff_from/eff_to) formats; range records are expanded to daily internally."}}}, {"data": {"id": "cs:InitialInventory", "label": "InitialInventory", "ntype": "class", "layers": ["ontology"], "color": "#a78bfa", "border": "#a78bfa", "detail": {"kind": "Class", "id": "cs:InitialInventory", "category": "cs:Inventory", "subClassOf": "cs:Inventory", "source_type": "config_input", "source_config": "M1_InitialInventory", "source_table": ["cdl_ps_hana_prd.dwd.vw_sc_inv_material_storage_location_batch_fact", "cdl_ps_hana_prd.ods.ewms_inventory_balance"], "comment": "Starting inventory at simulation initialization. Static point-in-time snapshot with no date dimension — represents day-0 stock positions."}}}, {"data": {"id": "cs:UnrestrictedInventory", "label": "UnrestrictedInventory", "ntype": "class", "layers": ["ontology"], "color": "#a78bfa", "border": "#a78bfa", "detail": {"kind": "Class", "id": "cs:UnrestrictedInventory", "category": "cs:Inventory", "subClassOf": "cs:Inventory", "source_type": "simulation_output", "source_config": "Orchestrator_unrestricted_inventory", "source_table": ["cdl_ps_hana_prd.ds.ps_psc_inventory_balance_daily_fact", "cdl_ps_hana_prd.dwd.vw_sc_inv_material_storage_location_fact"], "comment": "Daily end-of-day unrestricted inventory snapshot per material-location. Computed by Orchestrator as: BOD inventory + production_gr + delivery_gr - customer_shipments - outbound_deployments."}}}, {"data": {"id": "cs:InTransit", "label": "InTransit", "ntype": "class", "layers": ["ontology"], "color": "#a78bfa", "border": "#a78bfa", "detail": {"kind": "Class", "id": "cs:InTransit", "category": "cs:Inventory", "subClassOf": "cs:Inventory", "source_type": "simulation_output", "source_config": "Orchestrator_in_transit", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_po_sched_agreement_asn_shipno"], "comment": "Goods currently in transit between locations on a given date. Records exist only while shipment is en route; removed upon arrival and converted to DeliveryGR."}}}, {"data": {"id": "cs:ProductionGR", "label": "ProductionGR", "ntype": "class", "layers": ["ontology"], "color": "#a78bfa", "border": "#a78bfa", "detail": {"kind": "Class", "id": "cs:ProductionGR", "category": "cs:Inventory", "subClassOf": "cs:Inventory", "source_type": "simulation_output", "source_config": "Orchestrator_production_gr", "comment": "Goods receipt from production. Created when produced goods become available (available_date == current_date). Adds inventory at the production location."}}}, {"data": {"id": "cs:DeliveryGR", "label": "DeliveryGR", "ntype": "class", "layers": ["ontology"], "color": "#a78bfa", "border": "#a78bfa", "detail": {"kind": "Class", "id": "cs:DeliveryGR", "category": "cs:Inventory", "subClassOf": "cs:Inventory", "source_type": "simulation_output", "source_config": "Orchestrator_delivery_gr", "source_table": ["cdl_ps_hana_prd.ds.ps_psc_purchase_receipt_notification_daily_fact"], "comment": "Goods receipt from delivery. Created when an in-transit shipment arrives at the receiving location. Adds inventory at the receiving location."}}}, {"data": {"id": "cs:SafetyStock", "label": "SafetyStock", "ntype": "class", "layers": ["ontology"], "color": "#a78bfa", "border": "#a78bfa", "detail": {"kind": "Class", "id": "cs:SafetyStock", "category": "cs:Inventory", "subClassOf": "cs:Inventory", "source_type": "config_input", "source_config": "M3_SafetyStock", "source_table": ["cdl_ps_hana_prd.ds.ps_psc_safety_setting_daily_fact", "cdl_ps_hana_prd.ods.psdh_pdp_ibpi_ibp_sap_full_horizon_weekly_cn"], "comment": "Time-versioned safety stock target per material-location. Defines the buffer stock quantity below which replenishment is triggered. Used by M3 for safety stock planning and M5 for deployment decisions."}}}, {"data": {"id": "cs:DemandForecast", "label": "DemandForecast", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Class", "id": "cs:DemandForecast", "category": "cs:Plan", "subClassOf": "cs:Plan", "source_type": "config_input", "source_config": "M1_DemandForecast", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_bop_lbe_fcst"], "comment": "Weekly demand forecast per material-location. Input to M1 demand planning — drives order generation and downstream production/deployment planning."}}}, {"data": {"id": "cs:CustomerOrder", "label": "CustomerOrder", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Class", "id": "cs:CustomerOrder", "category": "cs:Plan", "subClassOf": "cs:Plan", "source_type": "simulation_output", "source_config": "M1_OrderLog", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_customer_order_delivery"], "comment": "Customer order generated by M1 demand planning. Represents daily demand that needs to be fulfilled from DC inventory."}}}, {"data": {"id": "cs:ProductionPlan", "label": "ProductionPlan", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Class", "id": "cs:ProductionPlan", "category": "cs:Plan", "subClassOf": "cs:Plan", "source_type": "simulation_output", "source_config": "M4_ProductionPlan", "comment": "Daily production plan output from M4. Three quantity tiers: uncon_planned_qty (ideal demand), con_planned_qty (capacity-constrained), produced_qty (actual after production reliability). Only con_planned_qty and produced_qty are modeled as core semantics."}}}, {"data": {"id": "cs:OpenDeployment", "label": "OpenDeployment", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Class", "id": "cs:OpenDeployment", "category": "cs:Plan", "subClassOf": "cs:Plan", "source_type": "simulation_output", "source_config": "Orchestrator_open_deployment", "source_table": ["cdl_ps_hana_prd.ds.ps_psc_transfer_pool_order_interval_30min_fact"], "comment": "Pending deployment awaiting truck release by M6. Created by M5 deployment planning, consumed by M6 logistics execution. Quantity decreases as shipments depart; record removed when fully shipped."}}}, {"data": {"id": "cs:DeploymentPlan", "label": "DeploymentPlan", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Class", "id": "cs:DeploymentPlan", "category": "cs:Plan", "subClassOf": "cs:Plan", "source_type": "simulation_output", "source_config": "M5_DeploymentPlan", "comment": "Deployment plan output from M5. Defines how much of each material to move between locations to satisfy downstream demand and maintain safety stock levels."}}}, {"data": {"id": "cs:CustomerShipment", "label": "CustomerShipment", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Class", "id": "cs:CustomerShipment", "category": "cs:Plan", "subClassOf": "cs:Plan", "source_type": "simulation_output", "source_config": "M1_ShipmentLog", "comment": "Customer shipment from DC to end customer. Generated by M1 when fulfilling customer orders from available inventory. Quantity shipped may be less than ordered (partial fill)."}}}, {"data": {"id": "cs:IntersiteDelivery", "label": "IntersiteDelivery", "ntype": "class", "layers": ["ontology"], "color": "#34d399", "border": "#34d399", "detail": {"kind": "Class", "id": "cs:IntersiteDelivery", "category": "cs:Plan", "subClassOf": "cs:Plan", "source_type": "simulation_output", "source_config": "M6_DeliveryPlan", "comment": "Intersite replenishment delivery between network locations. Executed by M6 logistics based on open deployments from M5. Moves inventory from sending to receiving location via truck."}}}, {"data": {"id": "cs:Calendar", "label": "Calendar", "ntype": "class", "layers": ["ontology"], "color": "#38bdf8", "border": "#38bdf8", "detail": {"kind": "Class", "id": "cs:Calendar", "category": "cs:Network", "subClassOf": "cs:Network", "source_type": "config_input", "source_config": "M1_OrderCalendar", "source_table": ["cdl_ps_hana_prd.sl.ps_psc_factory_calendar", "cdl_ps_hana_prd.ods.psdh_md_time_fdim"], "comment": "Factory/business calendar defining workdays and time periods. Used for order calendar generation and time-based conversions (week number to date)."     {selector:'node', style:{
      'label':'data(label)','font-size':7,'color':'#e2e8f0','text-valign':'center',
      'text-halign':'center','text-outline-width':1.4,'text-outline-color':'#0b0e17',
      'background-color':'data(color)','border-color':'data(border)','border-width':1,
      'width':16,'height':16,'text-max-width':90,'text-wrap':'ellipsis',
    }},
    {selector:'node[ntype="class"]', style:{'shape':'round-rectangle','width':26,'height':20,'font-size':8}},
    {selector:'node[ntype="param"]', style:{'shape':'ellipse','width':22,'height':22}},
    {selector:'node[ntype="metric"]', style:{'shape':'diamond','width':24,'height':24}},
    {selector:'node[ntype="process"]', style:{'shape':'hexagon','width':18,'height':18}},
    {selector:'node[ntype="config"]', style:{'shape':'round-tag','width':22,'height':16}},
    {selector:'node[ntype="output"]', style:{'shape':'tag','width':22,'height':16}},
    {selector:'node[ntype="databricks"]', style:{'shape':'barrel','width':20,'height':16,'font-size':6}},
    {selector:'edge', style:{
      'width':1.1,'line-color':'data(color)','target-arrow-color':'data(color)',
      'target-arrow-shape':'triangle','arrow-scale':0.7,'curve-style':'bezier',
      'opacity':0.7,'font-size':6,'color':'#94a3b8','text-outline-width':2,
      'text-outline-color':'#0b0e17','label':'data(label)',
    }},
    {selector:'edge[dashed="dash"]', style:{'line-style':'dashed'}},
    {selector:'.dim', style:{'opacity':0.07,'text-opacity':0}},
    {selector:'.hit', style:{'border-width':3,'border-color':'#fff'}},
    {selector:'node:selected', style:{'border-width':3,'border-color':'#fff'}},
  ],
  layout:{name:'fcose', quality:'default', animate:false, randomize:true,
          nodeRepulsion:9000, idealEdgeLength:70, nodeSeparation:80, packComponents:true},
});

function applyLayers(){
  cy.batch(() => {
    cy.nodes().forEach(n => {
      const vis = (n.data('layers')||[]).some(l => active.has(l));
      n.style('display', vis ? 'element' : 'none');
    });
    cy.edges().forEach(e => {
      const on = active.has(e.data('layer'));
      const ends = e.source().style('display')!=='none' && e.target().style('display')!=='none';
      e.style('display', (on && ends) ? 'element' : 'none');
    });
  });
}

function runLayout(name){
  const opts = name==='dagre'
    ? {name:'dagre', rankDir:'LR', nodeSep:18, rankSep:90, animate:false,
       fit:true, eles: cy.elements(':visible')}
    : {name:'fcose', animate:false, randomize:true, nodeRepulsion:9000,
       idealEdgeLength:70, nodeSeparation:80, packComponents:true, eles: cy.elements(':visible')};
  cy.layout(opts).run();
  document.getElementById('lay-fcose').classList.toggle('active', name!=='dagre');
  document.getElementById('lay-dagre').classList.toggle('active', name==='dagre');
}

// ---- side detail ---------------------------------------------------------- #
const FIELD_ORDER = ['kind','id','category','instanceOf','subClassOf','metric_class',
  'module','source_type','source_config','source_df','db_table','ontology_class',
  'param_type','feasibility_horizon','unit','metric_name','param_name',
  'computation_source','controls','required','columns','service',
  'source_table','comment'];
function showDetail(d){
  let h = '<h3>详情 Details</h3>';
  const col = (d._color)||'#94a3b8';
  h += '<span class="badge" style="background:'+col+'">'+(d.kind||'')+'</span>';
  const seen = new Set();
  FIELD_ORDER.forEach(k => {
    if(seen.has(k)) return; seen.add(k);
    let v = d[k];
    if(v===undefined||v===null||v==='') return;
    if(Array.isArray(v)) v = v.join('<br>');
    h += '<div class="kv"><span class="k">'+k.replace(/_/g,' ')+'</span><span class="v">'+v+'</span></div>';
  });
  document.getElementById('side').innerHTML = h;
}
cy.on('tap','node', evt => {
  const n = evt.target;
  const d = Object.assign({}, n.data('detail'));
  d._color = n.data('color');
  showDetail(d);
});

// ---- search --------------------------------------------------------------- #
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  cy.elements().removeClass('dim hit');
  if(!q) return;
  const hit = cy.nodes().filter(n => (n.data('label')||'').toLowerCase().includes(q)
                                  || ((n.data('detail')||{}).id||'').toLowerCase().includes(q));
  if(hit.length){
    cy.elements().addClass('dim');
    hit.removeClass('dim').addClass('hit');
    hit.neighborhood().removeClass('dim');
  }
});

// ---- left panel ----------------------------------------------------------- #
function buildLeft(){
  document.getElementById('layers').innerHTML = LAYER_DEF.map(([k,label,c]) =>
    '<label class="layer"><input type="checkbox" data-layer="'+k+'" checked>'
    + '<span class="sw" style="background:'+c+'"></span>'+label+'</label>').join('');
  document.querySelectorAll('#layers input').forEach(cb =>
    cb.addEventListener('change', () => {
      cb.checked ? active.add(cb.dataset.layer) : active.delete(cb.dataset.layer);
      applyLayers();
    }));
  document.getElementById('lg-nodes').innerHTML = NODE_LG.map(([c,l]) =>
    '<div class="lg"><span class="dot" style="background:'+c+'"></span>'+l+'</div>').join('');
  document.getElementById('lg-edges').innerHTML = EDGE_LG.map(([c,l]) =>
    '<div class="lg"><span class="ln" style="border-color:'+c+'"></span>'+l+'</div>').join('');
}

document.getElementById('lay-fcose').onclick = () => runLayout('fcose');
document.getElementById('lay-dagre').onclick = () => runLayout('dagre');
document.getElementById('fit').onclick = () => cy.fit(cy.elements(':visible'), 40);

document.getElementById('stats').textContent =
  STATS.class+' 类 · '+STATS.param+' 参数 · '+STATS.metric+' 指标 · '+STATS.process
  +' 过程 · '+STATS.config+' 配置 · '+STATS.output+' 输出 · '+STATS.databricks
  +' DB | '+STATS.nodes+' 节点 / '+STATS.edges+' 边';

buildLeft();
document.getElementById('lay-fcose').classList.add('active');
cy.ready(() => cy.fit(cy.elements(':visible'), 40));
</script>
</body>
</html>
