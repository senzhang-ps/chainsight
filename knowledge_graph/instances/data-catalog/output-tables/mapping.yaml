# ChainSight Output Table — Simulation Result Catalog
# Ground truth = live xq_vmr baseline DB (queried 2026-06-07), reconciled with
# pgsql_db/table_mapping.py (OUTPUT_TABLE_MAPPING) and schema/chainsight.jsonld.
#
# WHY THIS FILE EXISTS
# The ontology (chainsight.jsonld) describes simulation-output ENTITIES, but its
# cs:source_table points to real-world Databricks grounding tables and its
# cs:source_config is a logical label — NEITHER is the actual PostgreSQL result
# table. This catalog is the missing bridge: it pins each real PG output table to
# its ontology class and records all naming layers, because the names DIFFER
# across layers:
#
#   ontology source_config (logical) : M1_OrderLog
#   code dataframe key (table_mapping): orders_df
#   PG result table (this DB)         : module1_output_orderlog   <-- identity here
#   databricks grounding (validation) : ps_psc_customer_order_delivery
#
# Each entry:
#   db_table        : real PostgreSQL table name in xq_vmr (authoritative identity)
#   module          : producing module / orchestrator / summary
#   category        : simulation_output | orchestrator_state | log | validation | summary
#   ontology_class  : linked cs: class (null if the table has no ontology entity)
#   source_config   : ontology cs:source_config logical name (null if none)
#   source_df       : code-side key in pgsql_db/table_mapping.py OUTPUT_TABLE_MAPPING
#   key_columns     : business columns (the 4 common columns below are omitted)
#   description     : one-line business meaning

version: '1.0'
database: xq_vmr            # baseline reference DB used to verify table names + columns
common_columns: [run_id, sim_date, config_name, db_write_time]
notes: |
  Every output/orchestrator/summary table carries the 4 common_columns.
  Filter a single simulation run by run_id (configs are filtered by config_name).
  Total in xq_vmr baseline: 20 module + 12 orchestrator + 8 summary = 40 result tables.
  Internal system tables (sim_checkpoint, sim_m4_state) are NOT result outputs and
  are intentionally excluded.
  NAMING DIVERGENCE: table_mapping.py OUTPUT_TABLE_MAPPING['summary'] lists names
  like summary_full_production_plan_report that DO NOT EXIST in the DB; the real
  tables use the summary_output_full* form below. That code block is stale/unused —
  the live DB names here are authoritative.

outputs:

# ───────────────────────── Module 1 — Demand Planning (5) ─────────────────────────
- db_table: module1_output_orderlog
  module: module1
  category: simulation_output
  ontology_class: cs:CustomerOrder
  source_config: M1_OrderLog
  source_df: orders_df
  key_columns: [date, material, location, demand_type, simulation_date, advance_days, quantity]
  description: 客户订单日志 — M1 每日生成的需求订单（normal / AO 提前单）。

- db_table: module1_output_shipmentlog
  module: module1
  category: simulation_output
  ontology_class: cs:CustomerShipment
  source_config: M1_ShipmentLog
  source_df: shipment_df
  key_columns: [date, material, location, quantity, demand_type, order_id]
  description: 发运日志 — 实际从 DC 发给客户的数量（可能小于订单量，部分满足）。

- db_table: module1_output_cutlog
  module: module1
  category: log
  ontology_class: null
  source_config: null
  source_df: cut_df
  key_columns: [date, material, location, quantity]
  description: 砍单/缺口日志 — 因库存不足未满足的订单量。

- db_table: module1_output_supplydemandlog
  module: module1
  category: log
  ontology_class: null
  source_config: null
  source_df: supply_demand_df
  key_columns: [date, material, location, quantity, demand_element]
  description: 供需明细日志 — 按 demand_element 拆分的供需流水。

- db_table: module1_output_summary
  module: module1
  category: summary
  ontology_class: null
  source_config: null
  source_df: summary_df
  key_columns: [total_orders, total_shipments, total_cuts, total_supplydemand, date]
  description: M1 模块级汇总统计（订单/发运/砍单/供需总量）。

# ───────────────────────── Module 3 — MRP Planning (1) ─────────────────────────
- db_table: module3_output_netdemand
  module: module3
  category: simulation_output
  ontology_class: null
  source_config: null
  source_df: net_demand_df
  key_columns: [material, location, requirement_date, demand_element, layer, quantity, simulation_date, horizon_days]
  description: 净需求 — MRP 展开后按层级(layer)汇总的净需求，驱动 M4 生产计划。

# ───────────────────────── Module 4 — Production Planning (4) ─────────────────────────
- db_table: module4_output_productionplan
  module: module4
  category: simulation_output
  ontology_class: cs:ProductionPlan
  source_config: M4_ProductionPlan
  source_df: production_df
  key_columns: [material, location, line, simulation_date, production_plan_date, available_date, uncon_planned_qty, con_planned_qty, produced_qty, changeover_id, changeover_time, changeover_time_remaining, is_first_changeover_day]
  description: 生产计划 — 三层产量：uncon_planned(理想)/con_planned(产能受限)/produced(可靠性后实际)。

- db_table: module4_output_capacityexceed
  module: module4
  category: log
  ontology_class: null
  source_config: null
  source_df: exceed_log
  key_columns: [material, location, line, simulation_date, exceed_type, exceed_qty]
  description: 产能超限日志 — 需求超出产线产能的部分。

- db_table: module4_output_changeoverlog
  module: module4
  category: log
  ontology_class: null
  source_config: null
  source_df: changeover_log
  key_columns: [date, location, line, changeover_type, count, time, cost, mu_loss]
  description: 换型日志 — 产线换型次数、耗时、成本与 MU 损失。

- db_table: module4_output_validation
  module: module4
  category: validation
  ontology_class: null
  source_config: null
  source_df: issues_df
  key_columns: [sheet, row, issue]
  description: M4 配置校验问题清单。

# ───────────────────────── Module 5 — Deployment Planning (4) ─────────────────────────
