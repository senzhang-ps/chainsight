# =============================================================================
# ChainSight 默认参数集中配置
#
# 本文件为所有跨模块共享参数的唯一真源。
# 由 src/utils/defaults.py 加载后以 Python 常量形式暴露给各模块。
# =============================================================================

# ---------------------------------------------------------------------------
# 跨模块共享参数
# ---------------------------------------------------------------------------
workspace_root: ./workspace

shared:
  # 最小订单量 (mrp_planning, deployment_planning)
  default_moq: 1
  # 四舍五入值 (mrp_planning, deployment_planning)
  default_rv: 1
  # 规划时间栅栏 (mrp_planning, deployment_planning)
  default_ptf: 0
  # 批次规模键 (mrp_planning, deployment_planning)
  default_lsk: 1
  # 默认提前期天数 (deployment_planning)
  default_lead_time: 1
  # MRP 默认时间窗口 (mrp_planning)
  default_horizon: 1
  # 资源利用率 (cpu_config, resource_config 共用)
  resource_utilization: 0.9

# ---------------------------------------------------------------------------
# 需求规划模块 (Module1)
# ---------------------------------------------------------------------------
demand_planning:
  # 未来截断天数 —— 用于截取消耗后预测的时间窗口
  future_cutoff_days: 90
  # 最大AO提前天数
  default_max_advance_days: 10

# ---------------------------------------------------------------------------
# 生产计划模块 (Module4)
# ---------------------------------------------------------------------------
production_planning:
  # 默认换产时间（小时）
  default_changeover_time: 24.0

# ---------------------------------------------------------------------------
# 部署规划模块 (Module5)
# ---------------------------------------------------------------------------
deployment_planning:
  # 默认需求收集视界天数（LeadTime 配置缺失时的兜底值）
  default_horizon_days: 7
  # 推送层级阈值列表
  default_push_levels:
    - 1.2
    - 1.5
    - 2.0
    - 2.5
    - 3.0

# ---------------------------------------------------------------------------
# 物流执行模块 (Module6)
# ---------------------------------------------------------------------------
logistics_execution:
  # 最大等待天数
  max_wait_days: 30
  # 随机种子默认值
  random_seed: 42

# ---------------------------------------------------------------------------
# 数据库连接配置 (PostgreSQL)
#   由 pgsql_db/settings.py 读取。
#   允许调用方通过显式参数或 CLI --db-password 等覆盖单项字段。
#   生产环境建议将 password 改为 "" 并通过环境变量注入。
# ---------------------------------------------------------------------------
database:
  host: localhost
  port: 5432
  database: test_db
  user: postgres
  password: "123456"
  maintenance_database: postgres
  # P1 schema 隔离：每个 project 对应一个 PostgreSQL schema
  #   - schema_mode=project：从 ConfigDir.project 派生 schema（小写化、保留 -）
  #   - default_schema：纯 --config 模式无法解析 project 时的兜底 schema
  #   - auto_create_schema：缺失 schema 时自动 CREATE SCHEMA IF NOT EXISTS
  schema_mode: project
  default_schema: public
  auto_create_schema: true

# ---------------------------------------------------------------------------
# 输入配置表数据质量检测
# ---------------------------------------------------------------------------
data_quality:
  enabled: true
  mode: audit_only
  fail_on_error: false
  sample_limit: 20
  report_dir: input_quality
  config_tables:
    required_import:
      - Global_seed
      - Global_Network
      - Global_LeadTime
      - Global_DemandPriority
      - M1_InitialInventory
      - M1_DemandForecast
      - M1_ForecastError
      - M1_OrderCalendar
      - M3_SafetyStock
      - M4_MaterialLocationLineCfg
      - M4_LineCapacity
      - M4_ChangeoverMatrix
      - M4_ChangeoverDefinition
      - M4_ProductionReliability
      - M5_PushPullModel
      - M5_DeployConfig
      - M6_TruckReleaseCon
      - M6_MaterialMD
      - M6_DeliveryDelayDistribution
      - M6_MDQBypassRules
      - M6_TruckTypeSpecs
      - M6_TruckCapacityPlan
    optional_import:
      - M1_AOConfig
      - M1_DPSConfig
      - M1_SupplyChoiceConfig
      - Global_SpaceCapacity
    quality_check_enabled:
      Global_seed: true
      Global_Network: true
      Global_SpaceCapacity: true
      Global_LeadTime: true
      Global_DemandPriority: true
      M1_InitialInventory: true
      M1_DemandForecast: true
      M1_ForecastError: true
      M1_OrderCalendar: true
      M1_AOConfig: true
      M1_DPSConfig: true
      M1_SupplyChoiceConfig: true
      M3_SafetyStock: true
      M4_MaterialLocationLineCfg: true
      M4_LineCapacity: true
      M4_ChangeoverMatrix: true
      M4_ChangeoverDefinition: true
      M4_ProductionReliability: true
      M5_PushPullModel: true
      M5_DeployConfig: true
      M6_TruckReleaseCon:  true
      M6_MaterialMD: true
      M6_DeliveryDelayDistribution: true
      M6_MDQBypassRules: true
      M6_TruckTypeSpecs: true
      M6_TruckCapacityPlan: true
